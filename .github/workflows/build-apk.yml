name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["mobile/**", ".github/workflows/build-apk.yml"]
permissions: { contents: read }
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://example.supabase.co' }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY || 'placeholder' }}
      - uses: actions/upload-artifact@v7
        with: { name: skillconnect-debug-apk, path: mobile/build/app/outputs/flutter-apk/app-debug.apk }
