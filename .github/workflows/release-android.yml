name: Release Android (signed)
# Manual only. Never publishes to a store; it produces a signed AAB/APK as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type RELEASE to confirm', required: true }
permissions: { contents: read }
jobs:
  build:
    if: inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.7, channel: stable, cache: true }
      - name: Require signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KKP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KKP" ] || { echo "signing secrets missing"; exit 1; }
          echo "$KS" | base64 -d > android/app/release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KP" "$KA" "$KKP" > android/key.properties
      - run: flutter pub get && flutter analyze && flutter test
      - run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - if: always()
        run: rm -f android/key.properties android/app/release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: skillconnect-release
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
