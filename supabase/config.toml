# Minimal Supabase CLI config (generated by hand; run `supabase init` diff against it when upgrading the CLI).
project_id = "skillconnect"

[api]
enabled = true
schemas = ["public", "storage"]      # `private` is deliberately NOT exposed

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enable_signup = true
minimum_password_length = 10
[auth.email]
enable_confirmations = true

[functions.payments-webhook]
verify_jwt = false   # authenticated by the provider's signature instead
